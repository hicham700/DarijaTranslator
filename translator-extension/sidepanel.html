<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Translator Side Panel</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 12px;
        }

        h3 {
            text-align: center;
            margin-bottom: 12px;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #translateBtn {
            background-color: #3498db;
            color: white;
        }

        #translateBtn:hover {
            background-color: #2980b9;
        }

        #speakBtn {
            background-color: #27ae60;
            color: white;
        }

        #speakBtn:hover {
            background-color: #1e8449;
        }

        #output {
            margin-top: 10px;
            padding: 10px;
            min-height: 50px;
            background-color: #ffffff;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-weight: bold;
            font-size: 15px;
            direction: rtl;
            /* IMPORTANT pour l'arabe */
            text-align: right;
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <h3>English → Darija Translator</h3>

    <textarea id="inputText" placeholder="Type English text here..."></textarea>

    <button id="translateBtn">🌍 Translate</button>
    <button id="speakBtn">🔊 Lire la traduction</button>

    <div id="output"></div>

    <script src="sidepanel.js"></script>
</body>

</html>
